# Pages CMS settings (https://pagescms.org) — the editing screen Sara uses.
# Saving in Pages CMS commits to GitHub; Cloudflare Pages then rebuilds the site.
# Only the fields below are editable there; layout and design stay in code.

media:
  input: src/assets/cakes
  output: /cakes
  categories: [image]

content:
  - name: cakes
    label: Cakes
    type: collection
    path: src/content/cakes
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, occasion, featured]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Cake name
        type: string
        required: true
      - name: cover
        label: Main photo
        type: image
        required: true
      - name: occasion
        label: Occasion
        type: select
        required: true
        options:
          values: [Birthday, Wedding, Christening, Celebration, Everyday, Course]
      - name: summary
        label: One-line description
        description: Shown on the cake's page and in Google results. One sentence.
        type: text
        required: true
      - name: featured
        label: Show in the big slideshow at the top
        description: Keep this on for 3 to 5 of the best photos only.
        type: boolean
        default: false
      - name: tile
        label: Size in the photo grid
        description: Standard for most. Wide or Tall for the very best photos.
        type: select
        default: standard
        options:
          values: [standard, wide, tall]
      - name: focus
        label: Keep this part of the photo in view
        description: When the photo is cropped to fit. Choose Top for photos of people so heads are never cut off.
        type: select
        default: center
        options:
          values: [top, center, bottom]
      - name: order
        label: Position
        description: Lower numbers appear first, e.g. 10, 20, 30.
        type: number
        default: 100
      - name: flavours
        label: Flavours
        type: string
        list: true
      - name: serves
        label: Serves
        description: e.g. 12 to 16
        type: string
      - name: fromPrice
        label: Price from
        description: e.g. £45. Leave empty to hide.
        type: string
      - name: gallery
        label: Extra photos
        type: image
        list: true
      - name: body
        label: Longer description
        type: text
      - name: title_sk
        label: Cake name (Slovak)
        description: Shown on the Slovak version of the site. Leave empty to use the English name.
        type: string
      - name: summary_sk
        label: One-line description (Slovak)
        type: text
      - name: description_sk
        label: Longer description (Slovak)
        type: text
      - name: flavours_sk
        label: Flavours (Slovak)
        type: string
        list: true

  - name: site
    label: Site details
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: tagline
        label: Headline on the home page
        type: string
        required: true
      - name: intro
        label: Sentence under the headline
        type: text
        required: true
      - name: email
        label: Contact email shown on the site
        type: string
        required: true
      - name: instagram
        label: Instagram link
        type: string
      - name: whatsapp
        label: WhatsApp link
        description: e.g. https://wa.me/447123456789 — leave empty to hide the WhatsApp button.
        type: string
      - name: leadTime
        label: Notice needed for orders
        type: text
      - name: capacity
        label: How many cakes you take each week
        description: Shown under the order form. Leave empty to hide.
        type: text
      - name: tagline_sk
        label: Headline on the home page (Slovak)
        type: string
      - name: intro_sk
        label: Sentence under the headline (Slovak)
        type: text
      - name: leadTime_sk
        label: Notice needed for orders (Slovak)
        type: text
      - name: capacity_sk
        label: How many cakes you take each week (Slovak)
        type: text

  - name: faq
    label: Questions (FAQ)
    type: file
    path: src/data/faq.json
    format: json
    fields:
      - name: items
        label: Questions
        type: object
        list: true
        fields:
          - name: q
            label: Question
            type: string
            required: true
          - name: a
            label: Answer
            type: text
            required: true
          - name: q_sk
            label: Question (Slovak)
            type: string
          - name: a_sk
            label: Answer (Slovak)
            type: text
